name: Build image

# Publishes the image the release is built in (scripts/build/Dockerfile) to
# GitHub's container registry, and prints its digest. Run it by hand (Actions,
# Build image, Run workflow) when the Dockerfile or its snapshot date changes;
# then put the printed reference in scripts/build/IMAGE and commit it, so that
# `scripts/package.sh` pulls this image and builds without apt or any package
# snapshot. A new package of the registry is private until its visibility is
# made public in the package's settings: anyone who builds the release needs to
# pull it without logging in.
on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image=ghcr.io/$owner/smart-commit-build
          tag=$(date -u +%Y%m%d)
          docker build --tag "$image:$tag" scripts/build
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")
          {
            echo "### Build image"
            echo
            echo "Put this line in \`scripts/build/IMAGE\`:"
            echo
            echo '```'
            echo "$digest"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$digest"
