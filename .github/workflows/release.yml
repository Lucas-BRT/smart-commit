name: Release

# Releases happen by bumping `version` in cli/Cargo.toml: on every push to main,
# if there is no tag v<version> yet, this tests, packages (reproducibly, see
# scripts/package.sh) and publishes the release with notes from the commits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # The oldest supported Ubuntu, so the binary runs on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >>"$GITHUB_OUTPUT"
            echo "v$version is already released"
          else
            echo "new=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: rustup toolchain install
      # Only a release run restores and saves these, so the many pushes that
      # release nothing do not wait for them.
      - if: steps.version.outputs.new == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.version.outputs.new == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/build-cache
          key: package-${{ hashFiles('rust-toolchain.toml', 'scripts/build/Dockerfile', 'Cargo.lock') }}
          restore-keys: package-
      - if: steps.version.outputs.new == 'true'
        run: cargo test --locked
      - if: steps.version.outputs.new == 'true'
        env:
          SMART_COMMIT_BUILD_CACHE: ${{ runner.temp }}/build-cache
        run: scripts/package.sh dist
      - if: steps.version.outputs.new == 'true'
        run: cargo run --release --locked -q -p smart-commit-tools -- release-notes "v${{ steps.version.outputs.version }}" >notes.md
      - if: steps.version.outputs.new == 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "smart-commit ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
