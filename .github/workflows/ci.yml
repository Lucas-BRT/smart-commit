name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The runner's shellcheck changes with its image, and a newer one
      # brings new warnings: pinned like every other download.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --quiet -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >>"$GITHUB_PATH"
      - run: shellcheck --version && shellcheck install.sh scripts/*.sh cli/tests/fixtures/make-traces.sh cli/tests/scripts/*.sh
      - run: cli/tests/scripts/test-setup-gpu.sh
      - run: cli/tests/scripts/test-export-model.sh
      - run: cli/tests/scripts/test-install-data.sh
      - run: cli/tests/scripts/test-install-preflight.sh
      - run: cli/tests/scripts/test-normalize-ir.sh

  # Packages in the pinned build container (twice: the bytes must match)
  # and installs the result; the printed hash is the one any machine gets
  # for this commit.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain and the crates of the build container, not its build: the
      # hash printed below stays that of a build from scratch.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/build-cache
          key: package-${{ hashFiles('rust-toolchain.toml', 'scripts/build/Dockerfile', 'Cargo.lock') }}
          restore-keys: package-
      - run: cli/tests/scripts/test-install.sh
        env:
          SMART_COMMIT_BUILD_CACHE: ${{ runner.temp }}/build-cache
