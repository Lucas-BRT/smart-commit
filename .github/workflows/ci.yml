name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: shellcheck install.sh scripts/*.sh tests/fixtures/make-traces.sh tests/scripts/*.sh
      - run: tests/scripts/test-setup-gpu.sh
      - run: tests/scripts/test-fetch-model.sh
      - run: tests/scripts/test-setup.sh
      - run: tests/scripts/test-setup-llamacpp.sh
      - run: tests/scripts/test-normalize-ir.sh
      - run: tests/scripts/test-release-notes.sh

  # Packages in the pinned build container (twice: the bytes must match)
  # and installs the result; the printed hash is the one any machine gets
  # for this commit.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/scripts/test-install.sh
