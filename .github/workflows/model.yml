name: Model

# Exports the OpenVINO model with scripts/export-model.sh, which fails unless
# the result is byte for byte scripts/export/MANIFEST.sha256: this proves the
# export reproduces on another machine, as every user's machine exports it
# (smart-commit hosts no models). Run by hand after changing the pinned
# export.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NAME: qwen2.5-coder-1.5b-instruct-int4-sym-g128

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Make room (the export needs about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Export (fails if not identical to the committed manifest)
        run: scripts/export-model.sh "$RUNNER_TEMP/models/$NAME"
      - name: Keep the differing export for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: export-mismatch
          path: |
            ${{ runner.temp }}/models/*.partial/*.json
            ${{ runner.temp }}/models/*.partial/*.xml
            ${{ runner.temp }}/models/*.partial/MANIFEST.sha256
          retention-days: 7
