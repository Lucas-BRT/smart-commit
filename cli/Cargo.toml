[package]
name = "smart-commit"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
description = "Commit messages in your repository's style, from a small LLM running locally (NPU, GPU or CPU)"
license = "MIT"
repository = "https://github.com/Lucas-BRT/smart-commit"
readme = "../README.md"
keywords = ["git", "commit", "llm", "npu", "openvino"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
openvino-genai = { version = "=0.11.1", features = ["runtime-linking"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
toml.workspace = true
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
insta = "1.49.0"
tempfile.workspace = true
