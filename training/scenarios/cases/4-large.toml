# Level 4: large or mechanical changes across many files, where the diff
# no longer fits the prompt.
level = 4

[[case]]
id = "quote-style"
title = "formatação em massa"
repo = "cafeteria"
split = "train"
ops = [{ op = "regex", paths = ["src/cafeteria/*.py", "tests/*.py"], pattern = "\"(?!\"\")([^\"\\n]*)\"", repl = "'\\1'", optional = true }]
target = "troca aspas duplas por simples em todo o código"
expect = ["aspas|quote|format|estilo"]
tags = ["formatting"]

[[case]]
id = "rename-package"
title = "renomeia o pacote (diretório)"
repo = "cafeteria"
split = "eval"
ops = [
  { op = "git", args = ["mv", "src/cafeteria", "src/loja"] },
  { op = "regex", paths = ["src/loja/*.py", "tests/*.py", "README.md"], pattern = "\\bcafeteria\\.", repl = "loja.", optional = true },
]
target = "renomeia o pacote cafeteria para loja"
expect = ["renome|move", "loja"]
tags = ["rename"]

[[case]]
id = "license-header"
title = "cabeçalho de licença em todos os arquivos"
repo = "cafeteria"
split = "train"
ops = [{ op = "prepend", paths = ["src/cafeteria/*.py", "tests/*.py"], text = "# SPDX-License-Identifier: MIT\n" }]
target = "adiciona cabeçalho de licença MIT nos arquivos"
expect = ["licen|spdx|mit"]
tags = ["mechanical"]

[[case]]
id = "rename-symbol"
title = "renomeia um símbolo usado em todo lugar"
repo = "cafeteria"
split = "eval"
ops = [{ op = "regex", paths = ["src/cafeteria/*.py", "tests/*.py"], pattern = "\\bPedido\\b", repl = "Comanda", optional = true }]
target = "renomeia Pedido para Comanda"
expect = ["comanda", "renome|pedido"]
tags = ["rename"]

[[case]]
id = "squash"
title = "squash dos três últimos commits"
repo = "cafeteria"
split = "eval"
stage = "none"
ops = [{ op = "git", args = ["reset", "-q", "--soft", "HEAD~3"] }]
target = "corrige preço do capuccino, script de backup e taxa de serviço de 12%"
expect = ["capuccino|backup|taxa"]
tags = ["squash"]

[[case]]
id = "mixed-purposes"
title = "três propósitos misturados"
repo = "cafeteria"
split = "train"
ops = [
  { op = "replace", path = "src/cafeteria/estoque.py", old = "insuficente", new = "insuficiente" },
  { op = "append", path = "src/cafeteria/pedido.py", text = """
    def quantidade_itens(self) -> int:
        return sum(linha.quantidade for linha in self.linhas)
""" },
  { op = "append", path = "README.md", text = "\n## Testes\n\nRode `pytest` na raiz do projeto.\n" },
]
target = "conta itens do pedido, corrige typo do estoque e documenta os testes"
expect = ["itens|quantidade|conta", "typo|corrig|estoque", "test|readme|document"]
tags = ["mixed"]

[[case]]
id = "big-new-module"
title = "módulo novo grande"
repo = "cafeteria"
split = "train"
ops = [
  { op = "write", path = "src/cafeteria/cupons.py", text = "from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Cupom:\n    codigo: str\n    desconto: float\n    minimo: float\n\n\nCUPONS = {\n" },
  { op = "append", path = "src/cafeteria/cupons.py", text = "    \"CAFE{{i}}\": Cupom(\"CAFE{{i}}\", desconto=0.10, minimo={{i}}.0),\n", repeat = 120 },
  { op = "append", path = "src/cafeteria/cupons.py", text = "}\n\n\ndef valido(codigo: str, subtotal: float) -> bool:\n    cupom = CUPONS.get(codigo)\n    return cupom is not None and subtotal >= cupom.minimo\n" },
]
target = "adiciona cupons de desconto"
expect = ["cupo|cupom|desconto"]
tags = ["new-file"]

[[case]]
id = "generated-plus-one-line"
title = "arquivo minificado grande + uma linha"
repo = "cafeteria"
split = "eval"
ops = [
  { op = "write", path = "web/cardapio.min.js", text = "var c{{i}}=[{{i}},\"item{{i}}\"];", repeat = 4000 },
  { op = "replace", path = "src/cafeteria/config.py", old = "Café da Esquina", new = "Café do Largo" },
]
target = "muda o nome da loja para Café do Largo"
expect = ["nome|loja", "largo"]
tags = ["generated"]

[[case]]
id = "new-package"
title = "pacote de arquivos novos"
repo = "cafeteria"
split = "train"
ops = [
  { op = "write", path = "src/cafeteria/pagamento/__init__.py", text = "\"\"\"Formas de pagamento aceitas no caixa.\"\"\"\n" },
  { op = "write", path = "src/cafeteria/pagamento/base.py", text = "class FormaDePagamento:\n    nome = \"\"\n    taxa = 0.0\n\n    def liquido(self, valor: float) -> float:\n        return round(valor * (1 - self.taxa), 2)\n" },
  { op = "write", path = "src/cafeteria/pagamento/pix.py", text = "from cafeteria.pagamento.base import FormaDePagamento\n\n\nclass Pix(FormaDePagamento):\n    nome = \"pix\"\n" },
  { op = "write", path = "src/cafeteria/pagamento/cartao.py", text = "from cafeteria.pagamento.base import FormaDePagamento\n\n\nclass Credito(FormaDePagamento):\n    nome = \"crédito\"\n    taxa = 0.035\n\n\nclass Debito(FormaDePagamento):\n    nome = \"débito\"\n    taxa = 0.015\n" },
  { op = "write", path = "src/cafeteria/pagamento/dinheiro.py", text = "from cafeteria.pagamento.base import FormaDePagamento\n\n\nclass Dinheiro(FormaDePagamento):\n    nome = \"dinheiro\"\n\n    def troco(self, valor: float, pago: float) -> float:\n        if pago < valor:\n            raise ValueError(\"valor pago menor que o total\")\n        return round(pago - valor, 2)\n" },
  { op = "write", path = "src/cafeteria/pagamento/vale.py", text = "from cafeteria.pagamento.base import FormaDePagamento\n\n\nclass ValeRefeicao(FormaDePagamento):\n    nome = \"vale-refeição\"\n    taxa = 0.06\n" },
]
target = "formas de pagamento: pix, cartão, dinheiro e vale-refeição"
expect = ["pagamento|pix|cartao"]
tags = ["new-file", "feature"]

[[case]]
id = "delete-many"
title = "apaga vários arquivos"
repo = "cafeteria"
split = "eval"
ops = [
  { op = "git", args = ["rm", "-q", "src/cafeteria/estoque.py", "scripts/backup.sh"] },
  { op = "replace", path = ".gitignore", old = "*.sqlite\n", new = "" },
  { op = "replace", path = "src/cafeteria/config.py", old = "    arquivo_estoque: str = \"estoque.sqlite\"\n", new = "" },
]
target = "remove o controle de estoque e o backup do banco"
expect = ["remov|apaga|tira", "estoque|backup"]
tags = ["delete"]

[[case]]
id = "lockfile-only"
title = "só o lockfile"
repo = "ledger"
split = "eval"
ops = [{ op = "regex", path = "package-lock.json", pattern = "\"version\": \"6\\.19\\.8\"", repl = "\"version\": \"6.20.0\"" }]
target = "chore(deps): update lockfile"
expect = ["lock|deps|depend"]
tags = ["lockfile"]

[[case]]
id = "feature-tests-docs"
title = "feature + teste + docs"
repo = "ledger"
split = "train"
ops = [
  { op = "append", path = "src/transactions.ts", text = """
/** The net amount that entered (positive) or left (negative) `account`. */
export function net(journal: Journal, account: string): Money {
  return journal.entries.reduce(
    (sum, t) => (t.to === account ? sum.plus(t.amount) : t.from === account ? sum.minus(t.amount) : sum),
    Money.fromCents(0),
  );
}
""" },
  { op = "append", path = "test/transactions.test.ts", text = """
test("net sums what came in and went out", () => {
  const registry = new Registry();
  registry.open("cash", "asset");
  registry.open("bank", "asset");
  const journal = new Journal(registry);
  journal.record({ from: "bank", to: "cash", amount: Money.parse("50"), memo: "atm", date: "2026-01-03" });
  journal.record({ from: "cash", to: "bank", amount: Money.parse("20"), memo: "deposit", date: "2026-01-04" });
  assert.equal(net(journal, "cash").toString(), "30.00");
});
""" },
  { op = "replace", path = "test/transactions.test.ts", old = "import { Journal } from \"../src/transactions.js\";", new = "import { Journal, net } from \"../src/transactions.js\";" },
  { op = "append", path = "docs/usage.md", text = "\n`net(journal, account)` gives what entered an account minus what left it.\n" },
]
target = "feat(transactions): add net amount per account"
expect = ["^feat\\(transactions\\)", "net"]
tags = ["feature", "tests", "docs"]

[[case]]
id = "rename-type-everywhere"
title = "renomeia um tipo em todo o projeto"
repo = "ledger"
split = "eval"
ops = [{ op = "regex", paths = ["src/*.ts", "test/*.ts"], pattern = "\\bRegistry\\b", repl = "AccountBook", optional = true }]
target = "refactor(accounts): rename Registry to AccountBook"
expect = ["^refactor", "registry|accountbook|rename"]
tags = ["rename"]
