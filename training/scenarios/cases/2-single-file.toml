[[case]]
id = "report-totals"
title = "função nova"
repo = "ledger"
split = "train"
ops = [{ op = "append", path = "src/report.ts", text = """
/** The sum of the balances of each kind of account. */
export function totals(registry: Registry): Map<string, string> {
  const sums = new Map<string, Money>();
  for (const account of registry.all()) {
    sums.set(account.kind, (sums.get(account.kind) ?? Money.fromCents(0)).plus(account.balance));
  }
  return new Map([...sums].map(([kind, sum]) => [kind, sum.toString()]));
}
""" }, { op = "replace", path = "src/report.ts", old = "import { Account, Registry } from \"./accounts.js\";", new = "import { Account, Registry } from \"./accounts.js\";\nimport { Money } from \"./money.js\";" }]
target = "feat(report): add totals per account kind"
expect = ["^feat\\(report\\)", "total|sum"]
tags = ["feature"]

[[case]]
id = "extract-format"
title = "extrai uma função de formatação"
repo = "ledger"
split = "eval"
ops = [{ op = "replace", path = "src/money.ts", old = """  toString(): string {
    const sign = this.cents < 0 ? "-" : "";
    const abs = Math.abs(this.cents);
    return `${sign}${Math.floor(abs / 100)}.${String(abs % 100).padStart(2, "0")}`;
  }""", new = """  toString(): string {
    return formatCents(this.cents);
  }
}

function formatCents(cents: number): string {
  const sign = cents < 0 ? "-" : "";
  const abs = Math.abs(cents);
  return `${sign}${Math.floor(abs / 100)}.${String(abs % 100).padStart(2, "0")}`;""" }]
target = "refactor(money): extract cents formatting"
expect = ["^refactor\\(money\\)", "format|extract"]
tags = ["refactor"]

[[case]]
id = "more-tests"
title = "testes novos num arquivo existente"
repo = "ledger"
split = "train"
ops = [{ op = "append", path = "test/money.test.ts", text = """
test("adds and subtracts", () => {
  const a = Money.parse("10.50");
  const b = Money.parse("0.75");
  assert.equal(a.plus(b).toString(), "11.25");
  assert.equal(b.minus(a).toString(), "-9.75");
});

test("rejects garbage", () => {
  assert.throws(() => Money.parse("ten"));
  assert.throws(() => Money.parse("1.234"));
});
""" }]
target = "test(money): cover arithmetic and invalid amounts"
expect = ["^test\\(money\\)"]
tags = ["tests"]

[[case]]
id = "memo-search"
title = "busca nova"
repo = "ledger"
split = "eval"
ops = [{ op = "append", path = "src/transactions.ts", text = """
/** Transfers whose memo contains `text`, ignoring case. */
export function searchMemos(journal: Journal, text: string): Transfer[] {
  const needle = text.toLowerCase();
  return journal.entries.filter((t) => t.memo.toLowerCase().includes(needle));
}
""" }]
target = "feat(transactions): search transfers by memo"
expect = ["^feat\\(transactions\\)", "memo|search"]
tags = ["feature"]
