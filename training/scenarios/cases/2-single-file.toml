[[case]]
id = "rewrite-function"
title = "reescreve uma função"
repo = "cafeteria"
split = "eval"
ops = [{ op = "replace", path = "src/cafeteria/cardapio.py", old = """def buscar(codigo: str) -> Item:
    try:
        return CARDAPIO[codigo]
    except KeyError:
        raise ValueError(f"item desconhecido: {codigo}") from None""", new = """def buscar(codigo: str) -> Item:
    chave = codigo.strip().lower().replace(" ", "-")
    item = CARDAPIO.get(chave)
    if item is None:
        raise ValueError(f"item desconhecido: {codigo}")
    return item""" }]
target = "busca no cardápio ignora maiúsculas e espaços"
expect = ["busca|codigo", "maiuscul|espac|normaliz"]
tags = ["feature"]

[[case]]
id = "new-test-file"
title = "arquivo de teste novo"
repo = "cafeteria"
split = "train"
ops = [{ op = "write", path = "tests/test_cardapio.py", text = """import pytest

from cafeteria.cardapio import buscar, por_categoria


def test_busca_item_conhecido():
    assert buscar("cafe").preco == 6.00


def test_item_desconhecido_da_erro():
    with pytest.raises(ValueError):
        buscar("pizza")


def test_bebidas():
    assert {item.codigo for item in por_categoria("bebida")} == {
        "cafe", "espresso", "capuccino", "cha",
    }
""" }]
target = "testes do cardápio"
expect = ["test", "cardapio"]
tags = ["tests"]

