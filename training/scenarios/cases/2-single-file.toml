# Level 2: one file, ten to a hundred lines.
level = 2

[[case]]
id = "new-methods"
title = "métodos novos"
repo = "cafeteria"
split = "train"
ops = [{ op = "append", path = "src/cafeteria/pedido.py", text = """
    def quantidade_itens(self) -> int:
        return sum(linha.quantidade for linha in self.linhas)

    def vazio(self) -> bool:
        return not self.linhas
""" }]
target = "adiciona contagem de itens ao pedido"
expect = ["quantidade|contagem|conta|itens", "pedido|vazio"]
tags = ["feature"]

[[case]]
id = "delete-method"
title = "apaga um método"
repo = "cafeteria"
split = "eval"
ops = [{ op = "replace", path = "src/cafeteria/pedido.py", old = """    def remover(self, codigo: str) -> None:
        self.linhas = [l for l in self.linhas if l.item.codigo != codigo]

""", new = "" }]
target = "remove o método remover do pedido"
expect = ["remov|apaga|tira", "remover|metodo"]
tags = ["cleanup"]

[[case]]
id = "new-query"
title = "consulta nova"
repo = "cafeteria"
split = "train"
ops = [{ op = "append", path = "src/cafeteria/estoque.py", text = """
    def abaixo_do_minimo(self, minimo: int) -> list[tuple[str, int]]:
        \"\"\"Itens com menos de `minimo` unidades, do mais escasso ao menos.\"\"\"
        return self.conexao.execute(
            "select codigo, quantidade from estoque where quantidade < ? order by quantidade",
            (minimo,),
        ).fetchall()
""" }]
target = "lista os itens abaixo do estoque mínimo"
expect = ["minimo|abaixo|escass", "estoque|itens"]
