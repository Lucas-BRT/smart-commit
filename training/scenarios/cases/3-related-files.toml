# Level 3: a few related files, one purpose.
level = 3

[[case]]
id = "menu-command"
title = "feature em dois arquivos"
repo = "cafeteria"
split = "train"
ops = [
  { op = "append", path = "src/cafeteria/cardapio.py", text = """

def formatado(moeda: str) -> str:
    linhas = []
    for categoria in ("bebida", "salgado", "doce"):
        linhas.append(categoria.upper())
        linhas += [f"  {i.nome:<26} {moeda} {i.preco:>5.2f}" for i in por_categoria(categoria)]
    return "\\n".join(linhas)
""" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "    sub.add_parser(\"relatorio\"", new = "    sub.add_parser(\"cardapio\", help=\"mostra o cardápio com os preços\")\n    sub.add_parser(\"relatorio\"" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "    else:\n        print(\"nenhum pedido registrado hoje\")", new = "    elif args.comando == \"cardapio\":\n        print(formatado(config.moeda))\n    else:\n        print(\"nenhum pedido registrado hoje\")" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "from cafeteria.config import Config\n", new = "from cafeteria.cardapio import formatado\nfrom cafeteria.config import Config\n" },
]
target = "comando para mostrar o cardápio com os preços"
expect = ["cardapio", "comando|mostra|lista|exib"]
tags = ["feature"]

[[case]]
id = "move-function"
title = "move uma função para um módulo novo"
repo = "cafeteria"
split = "eval"
ops = [
  { op = "replace", path = "src/cafeteria/relatorio.py", old = """

def recibo(pedido: Pedido, config: Config) -> str:
    modelo = (TEMPLATES / "recibo.txt").read_text()
    linhas = "\\n".join(
        f"{l.quantidade}x {l.item.nome:<24} {config.moeda} {l.subtotal:>6.2f}" for l in pedido.linhas
    )
    return modelo.format(
        loja=config.nome_loja, mesa=pedido.mesa, linhas=linhas,
        total=f"{config.moeda} {pedido.total(config):.2f}",
    )
""", new = "" },
  { op = "write", path = "src/cafeteria/recibo.py", text = """from pathlib import Path

from cafeteria.config import Config
from cafeteria.pedido import Pedido

TEMPLATES = Path(__file__).parent.parent.parent / "templates"


def recibo(pedido: Pedido, config: Config) -> str:
    modelo = (TEMPLATES / "recibo.txt").read_text()
    linhas = "\\n".join(
        f"{l.quantidade}x {l.item.nome:<24} {config.moeda} {l.subtotal:>6.2f}" for l in pedido.linhas
    )
    return modelo.format(
        loja=config.nome_loja, mesa=pedido.mesa, linhas=linhas,
        total=f"{config.moeda} {pedido.total(config):.2f}",
    )
""" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "from cafeteria.relatorio import recibo", new = "from cafeteria.recibo import recibo" },
]
target = "move o recibo para um módulo próprio"
expect = ["move|separa|extrai|modulo", "recibo"]
tags = ["move", "refactor"]

