[[case]]
id = "rename-and-rewrite"
title = "rename com reescrita: o git vê apagar + criar"
repo = "cafeteria"
split = "train"
ops = [
  { op = "git", args = ["rm", "-q", "src/cafeteria/config.py"] },
  { op = "write", path = "src/cafeteria/ajustes.py", text = """\"\"\"Ajustes da loja, lidos uma vez na inicialização.\"\"\"

from typing import NamedTuple


class Ajustes(NamedTuple):
    nome_loja: str = "Café da Esquina"
    moeda: str = "R$"
    taxa_servico: float = 0.12
    desconto_maximo: float = 0.30
    arquivo_estoque: str = "estoque.sqlite"


PADRAO = Ajustes()


def carregar(caminho: str) -> Ajustes:
    \"\"\"Lê os ajustes de um TOML; o que faltar fica com o valor padrão.\"\"\"
    import tomllib

    with open(caminho, "rb") as arquivo:
        dados = tomllib.load(arquivo)
    desconhecidos = set(dados) - set(Ajustes._fields)
    if desconhecidos:
        raise ValueError(f"ajustes desconhecidos: {sorted(desconhecidos)}")
    return PADRAO._replace(**dados)
""" },
  { op = "regex", paths = ["src/cafeteria/*.py", "tests/*.py"], pattern = "from cafeteria\\.config import Config", repl = "from cafeteria.ajustes import Ajustes as Config", optional = true },
]
target = "troca config.py por ajustes.py, que também lê os ajustes de um TOML"
expect = ["ajustes|renome|troca|config"]
tags = ["rename"]

