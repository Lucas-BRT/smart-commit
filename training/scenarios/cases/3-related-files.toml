[[case]]
id = "opening-hours"
title = "módulo novo + uso"
repo = "cafeteria"
split = "train"
ops = [
  { op = "write", path = "src/cafeteria/horario.py", text = """from datetime import datetime, time

ABRE = time(7, 0)
FECHA = time(19, 0)


def aberto(agora: datetime) -> bool:
    \"\"\"A loja abre de segunda a sábado, das 7h às 19h.\"\"\"
    return agora.weekday() < 6 and ABRE <= agora.time() < FECHA
""" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "    if args.comando == \"pedido\":\n", new = "    if args.comando == \"pedido\":\n        if not aberto(datetime.now()):\n            sys.exit(\"loja fechada\")\n" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "import argparse\n", new = "import argparse\nfrom datetime import datetime\n" },
  { op = "replace", path = "src/cafeteria/cli.py", old = "from cafeteria.config import Config\n", new = "from cafeteria.config import Config\nfrom cafeteria.horario import aberto\n" },
]
target = "recusa pedidos fora do horário de funcionamento"
expect = ["horario|fechad|aberto|funcionamento"]
tags = ["feature"]

