services:
  web:
    build:
      context: ..
      dockerfile: website/Dockerfile
    image: smart-commit-website
    # No published port: behind a reverse proxy (Dokploy's Traefik) the domain
    # points at the container's port 3000, and a host port would clash with
    # whatever else listens there. `compose.override.yaml` publishes it for
    # local use.
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
