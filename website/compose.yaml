services:
  web:
    build:
      context: ..
      dockerfile: website/Dockerfile
    image: smart-commit-website
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
