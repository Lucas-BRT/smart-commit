[package]
name = "smart-commit"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Commit messages in your repository's style, from a small LLM running locally (NPU, GPU or CPU)"
license = "MIT"
repository = "https://github.com/Lucas-BRT/smart-commit"
readme = "README.md"
keywords = ["git", "commit", "llm", "npu", "openvino"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
openvino-genai = { version = "=0.11.1", features = ["runtime-linking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3"

[profile.release]
# No debug info: smaller, and no build paths in the binary (reproducible).
strip = true
