[package]
name = "npu-commit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
openvino-genai = { version = "=0.11.1", features = ["runtime-linking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3"
