[workspace]
members = ["cli", "tools", "training/tools", "website"]
# What `cargo build` and the release build make: the tools and the website
# stay out of it.
default-members = ["cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

# One version of each dependency that several members use; a member adds
# its own features beside `workspace = true`.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"

[profile.release]
# No debug info: smaller, and no build paths in the binary (reproducible).
strip = true

# The website's release build: a small, self-contained binary; the server is
# I/O-bound, so size beats speed. `cargo build --profile website`.
[profile.website]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
